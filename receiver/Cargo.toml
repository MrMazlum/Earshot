[package]
name = "earshot-receiver"
version = "1.1.0"
edition = "2021"
# Ubuntu 24.04 ships Rust 1.75 and that is what is actually installed on the dev laptop. Keep this
# pinned so a newer-only API fails at compile time here, rather than on the owner's machine.
rust-version = "1.75"
description = "Earshot PC receiver - turns your phone into this machine's microphone"
license = "GPL-3.0-or-later"
repository = "https://github.com/MrMazlum/Earshot"

[dependencies]
cpal = "0.15"
# Opus, the compressed format the phone sends. `opusic-sys` builds libopus from its own vendored
# source with CMake and links it **statically**, which is why it is preferred over the crates that
# expect a system libopus: the receiver stays a single file the user can run, and the Windows build
# needs no vcpkg. CMake is the only new build-time requirement, and the Android SDK already ships
# one on the dev box.
opusic-sys = "0.7"
# Enumerating local interfaces, which std cannot do. Needed because the default route is not the
# LAN when a VPN is up (Cloudflare WARP, Tailscale) and we would otherwise tell the phone to
# connect to an address it cannot reach. Tiny, no transitive deps beyond libc/windows-sys.
if-addrs = "0.13"

# DeepFilterNet, the heavier cleaner. RNNoise on the phone is a 2017 model built for STEADY noise
# and it is honest about transients: he can still hear his own keyboard and mouse through it. This
# one is trained for exactly that, and the difference is the whole reason it is here.
#
# Pinned by git REVISION, never by tag: a forge generates a tag's tarball per request and it is not
# byte-stable (measured — two hashes for one URL), and a cargo git dependency resolves a rev
# reproducibly where a tag can be moved.
#
# `tract` is a pure-Rust ONNX runtime, so this adds no C++ and nothing to the Windows build beyond
# more Rust. `default-features = false` drops the audio-file readers and the dataset machinery,
# which are for training and have no business in a receiver.
#
# MIT/Apache-2.0, code and weights both, which sits fine beside this GPL-3.0 program.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
# Only for the two array views DeepFilterNet's `process` takes. Pinned to the same major as the one
# `deep_filter` resolves, or the types are different types with the same name.
ndarray = "0.15"

# The tray icon, Linux only. `ksni` speaks StatusNotifierItem over D-Bus directly, in Rust — which
# is why it is preferred over `tray-icon`/`libappindicator`: those need
# libayatana-appindicator3-dev, a system package the dev machine does not have. GNOME needs the
# (Ubuntu-default) AppIndicator extension either way.
#
# Target-gated rather than merely optional, so a Windows build never tries to resolve it. The
# `earshot-tray` binary still exists on Windows; its body compiles down to a message saying to use
# earshot-receiver instead.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.2", optional = true }

# The Windows tray, by hand. There is no `ksni` equivalent here: every crate that wraps the
# notification area (`tray-icon`, `trayicon`) expects a GUI event loop — usually `winit` — which
# this program does not otherwise have and would be a large dependency to acquire for one icon.
# `windows-sys` is raw declarations only: no code, no runtime, no build script. It is already in
# the dependency graph for this target, so it costs nothing extra to build.
#
# Only the modules actually called are enabled, so the rest is not even parsed.
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",           # the tray icon, drawn into a DIB section
    "Win32_System_DataExchange",    # copying the pairing code to the clipboard
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",        # the start-at-login entry
    "Win32_UI_Shell",               # Shell_NotifyIcon
    "Win32_UI_WindowsAndMessaging",
]

# The macOS menu-bar icon. `tray-icon` (by tauri-apps) wraps `NSStatusItem` and its menu — the
# macOS equivalent of `ksni` on Linux and of `wintray.rs` on Windows, but a dependency rather than
# something hand-rolled, because unlike the Win32 notification area there is a maintained crate for
# it. MIT OR Apache-2.0, so it sits fine beside this GPL-3.0 program.
#
# `objc2` and the two Apple framework bindings are here for the *run loop*, not the icon:
# `tray-icon` on macOS needs an AppKit event loop already running on the main thread before the
# icon is created. The alternative to driving `NSApplication` ourselves is `winit`, which brings a
# whole windowing stack this program has no other use for. `default-features = false` keeps it to
# the handful of AppKit and Foundation items actually named — the run loop, a date, the application
# object, the Help dialogs (`NSAlert`) and the pasteboard the address is copied to. MIT, same as
# everything else here.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSDate",
    "NSRunLoop",
    "NSString",
] }

[features]
default = ["tray"]
# Each `dep:` is target-gated above, so this activates whichever one exists for the platform being
# built and none of them on, say, a BSD. macOS uses `tray-icon`; Linux `ksni`; Windows the
# hand-rolled `wintray.rs`. Exactly one is ever non-empty.
tray = [
    "dep:ksni",
    "dep:windows-sys",
    "dep:tray-icon",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[profile.release]
opt-level = 3
lto = true

[lib]
name = "earshot"
path = "src/lib.rs"

[[bin]]
name = "earshot-receiver"
path = "src/main.rs"

[[bin]]
name = "earshot-testsend"
path = "src/bin/testsend.rs"

[[bin]]
name = "earshot-tray"
path = "src/bin/tray.rs"
required-features = ["tray"]

# Two development tools. They are not part of what a user downloads: the release workflow names the
# binaries it ships, and these are not among them.
#
# `earshot-record` captures the phone's stream to a wav without playing it, which is the only way
# to test audio on a machine with no sound card. `earshot-clean` runs one such recording through
# every cleaner so they can be compared by ear instead of by claim.
[[bin]]
name = "earshot-record"
path = "src/bin/record.rs"

[[bin]]
name = "earshot-clean"
path = "src/bin/clean.rs"
