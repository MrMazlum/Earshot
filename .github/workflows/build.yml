name: build

# Every push builds all three artifacts. A tag also publishes them as a release, which is where the
# download links in the README point.
#
# This workflow is not a nicety: the Windows receiver is written on a Linux laptop with no
# cross-compiler, so **this is the only thing that compiles it**. If the Windows job goes red, the
# Windows build is broken — there is no local check that would have caught it first.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Only the release job writes anything.
permissions:
  contents: read

jobs:
  receiver:
    name: receiver (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            package: earshot-receiver-linux-x86_64
          - os: windows-latest
            label: windows
            package: earshot-receiver-windows-x86_64
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # cpal needs ALSA headers and ksni needs D-Bus ones. Windows uses WASAPI and Win32, which
      # need nothing installed.
      - name: Install Linux audio and D-Bus headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      # --locked throughout: the lockfile is deliberately kept at version 3 so the Rust that Ubuntu
      # ships (1.75) can still read it. Without this a newer cargo would quietly rewrite it to
      # version 4 and the dev machine would stop building.
      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/${{ matrix.package }}
          cp target/release/earshot-receiver target/release/earshot-tray dist/${{ matrix.package }}/
          cp README.md dist/${{ matrix.package }}/
          cp ../LICENSE dist/${{ matrix.package }}/
          tar -czf dist/${{ matrix.package }}.tar.gz -C dist ${{ matrix.package }}

      # The tray is the thing to double-click, so it ships under a name somebody would double-click:
      # `Earshot.exe`. It is built with the `windows` subsystem and opens no console at all.
      # `earshot-receiver.exe` stays alongside it for when something is wrong and the live counters
      # are worth watching, with a .bat so it can be started without a terminal either.
      #
      # `START HERE.txt` is rewritten with CRLF line endings. Notepad has coped with bare LF since
      # Windows 10 1809, but this file is read by somebody whose setup is already not working, and
      # a wall of text on one line is a bad first impression from a tool that has never run before.
      #
      # -Path names the folder, not its contents, so the zip has one folder inside it. With `/*` the
      # files land loose in whatever the user extracted into, which is usually Downloads.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.package }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/earshot-tray.exe "$dir/Earshot.exe"
          Copy-Item target/release/earshot-receiver.exe $dir/
          Copy-Item windows/earshot-console.bat $dir/
          Copy-Item README.md $dir/
          Copy-Item ../LICENSE $dir/
          (Get-Content windows/start-here.txt -Raw) -replace "`r`n", "`n" -replace "`n", "`r`n" |
            Set-Content -NoNewline -Path "$dir/START HERE.txt" -Encoding ascii
          Compress-Archive -Path $dir -DestinationPath dist/${{ matrix.package }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: receiver/dist/${{ matrix.package }}.*
          if-no-files-found: error

  app:
    name: android apk
    runs-on: ubuntu-latest
    # The release job states in the notes whether the APK it is publishing was really signed.
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Includes the pairing-code vectors, which the Rust job checks against the same file. If the
      # two implementations ever drift, one of these two jobs goes red.
      - run: flutter test

      # Writes the keystore the release build signs with, when the repository has one to give.
      #
      # Four secrets, all set together: ANDROID_KEYSTORE_BASE64 (the .jks, base64), and
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. CONTRIBUTING.md has the
      # commands that produce them. Secrets are not exposed to workflows triggered by a fork's pull
      # request, so on those this step takes the unsigned path and the build still goes green.
      #
      # Without them the build carries on and Gradle falls back to the debug key — whose password
      # is the published string "android" and whose keystore is generated by whoever builds, so it
      # attests to nothing at all. That fallback is announced here, recorded as a job output, and
      # repeated in the release notes, so it can never be mistaken for a signed build.
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Debug-signed APK::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with the Android debug key. Fine to sideload; not a basis for trusting the build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/earshot-release.jks
          # Written with printf rather than a heredoc so a password containing a $ survives. A
          # backslash still would not: Java .properties treats it as an escape.
          {
            printf 'storeFile=earshot-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      # The runner is thrown away, but a keystore should not outlive the step that needed it — and
      # `if: always()` means a failed build does not leave one lying around for later steps either.
      - name: Shred the keystore
        if: always()
        run: rm -f android/earshot-release.jks android/key.properties

      # `apksigner` is the only thing that actually knows which key was used. Gradle would happily
      # have fallen back to debug on a typo'd secret, and this is what catches that before the
      # artifact is published rather than after somebody installs it.
      - name: Say which key signed it
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk |
            tee /dev/stderr | grep -q 'CN=Android Debug' && debug=yes || debug=no
          echo "Debug-signed: $debug (expected no=$( [ '${{ steps.signing.outputs.signed }}' = 'true' ] && echo yes || echo no ))"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ] && [ "$debug" = "yes" ]; then
            echo "::error::A keystore was provided but the APK came out debug-signed."
            exit 1
          fi

      - name: Name the APK after the build
        run: mv build/app/outputs/flutter-apk/app-release.apk earshot.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: earshot-apk
          path: app/earshot.apk
          if-no-files-found: error

  release:
    name: publish release
    # Only tags publish. Everything above still runs on every push, as a check.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [receiver, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      # A debug-signed APK says so on the release page, not only in SECURITY.md — most people
      # downloading a build will never open that file. GitHub prepends this body to the notes it
      # generates, so the warning is the first thing above the changelog.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.app.outputs.signed }}
        run: |
          notes=$(mktemp)
          if [ "$SIGNED" != "true" ]; then
            cat > "$notes" <<'EOF'
          > [!WARNING]
          > **`earshot.apk` in this release is signed with the Android debug key.** Its password is
          > the published string `android`, so the signature proves nothing about where this file
          > came from and Android will warn you twice while installing it. It is fine to sideload if
          > you trust this repository; it is not evidence that you should. Building it yourself with
          > `cd app && flutter build apk --release` gives you the same app and a key that is
          > yours — see
          > [SECURITY.md](https://github.com/MrMazlum/Earshot/blob/main/SECURITY.md).

          EOF
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Earshot ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            --generate-notes \
            artifacts/earshot-apk/earshot.apk \
            artifacts/earshot-receiver-linux-x86_64/*.tar.gz \
            artifacts/earshot-receiver-windows-x86_64/*.zip
