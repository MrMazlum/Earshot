name: earshot
description: "Use your phone as your PC's microphone, over Wi-Fi."

# Not a package. This is an application and is never published to pub.dev.
publish_to: "none"

# version+build. The number after the `+` is Android's versionCode: bump it on every release, or
# the new APK will refuse to install over the old one.
version: 0.1.3+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lint set lives in analysis_options.yaml; CI runs `flutter analyze` on every push.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Generated by tools/icon/make_icons.py, together with every Android launcher size.
    - assets/icon.png
